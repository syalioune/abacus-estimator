<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Abacus">
  <title>Abacus</title>
  <!-- The mark is the complexity ladder: five rungs of rising height, one
       picked out in accent. Sizing an item is choosing one bar out of five. -->
  <rect x="2"  y="34" width="6" height="12" fill="#201e1d"/>
  <rect x="11" y="28" width="6" height="18" fill="#201e1d"/>
  <rect x="20" y="20" width="6" height="26" fill="#ec3013"/>
  <rect x="29" y="12" width="6" height="34" fill="#201e1d"/>
  <rect x="38" y="2"  width="6" height="44" fill="#201e1d"/>
</svg>
